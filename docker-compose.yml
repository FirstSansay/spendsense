# Конфигурация запуска SpendSense в Docker (Docker-сервер 192.168.14.234)
services:
  bot:
    build: .
    image: spendsense:latest
    container_name: spendsense-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
    volumes:
      # Данные SQLite храним на постоянном томе (переживает перезапуск контейнера)
      - spendsense-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  spendsense-data: