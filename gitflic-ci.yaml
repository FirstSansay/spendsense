# CI/CD конфигурация GitFlic (gitflic-ci.yaml)
#
# Раннер ci-docker-234 установлен на Docker-сервере 192.168.14.234.
# Задачи выполняются в контейнерах, при этом /var/run/docker.sock смонтирован
# в каждое задание — поэтому сборка и деплой идут напрямую через Docker
# (без docker:dind и без SSH к серверу).
#
# Переменные CI/CD (задаются в GitFlic: проект → CI/CD → Переменные):
#   BOT_TOKEN          — токен Telegram-бота
#   OPENROUTER_API_KEY — ключ OpenRouter (маскированная)
#   (опционально) AI_MODEL, AI_MODEL_OCR, AI_MODEL_STT, DATABASE_URL

stages:
  - build
  - deploy

# ---------- Сборка образа ----------
build:
  stage: build
  image: docker:latest
  script:
    - docker build -t spendsense:latest .

# ---------- Деплой на Docker-сервер ----------
deploy:
  stage: deploy
  image: docker:latest
  script:
    # Секреты передаются в контейнер через .env, сгенерированный на стадии deploy
    # (в репозитории секреты не хранятся)
    - echo "BOT_TOKEN=$BOT_TOKEN" > .env
    - echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env
    - echo "DATABASE_URL=sqlite:////app/data/spendsense.db" >> .env
    - docker compose up -d --build
  environment:
    name: production

